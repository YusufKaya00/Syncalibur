name: Syncalibur Controlled Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer Bump Type (auto, patch, minor, major)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (preview changelog without creating tag/release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: SemVer Release & Asset Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch All Tags
        run: git fetch --tags --force

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Engine
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/syncalibur ./cmd/syncalibur-engine

      - name: Run Automated Release Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          BUMP="${{ github.event.inputs.bump || 'auto' }}"
          ./bin/syncalibur release "${BUMP}" ${FLAGS}
